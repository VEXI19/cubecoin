[package]
name = "cubecoin-wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
cubecoin-core = { path = "../core" }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
getrandom = { version = "0.4.3", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
zeroize = "1.9.1"
