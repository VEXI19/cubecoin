[package]
name = "cubecoin-p2p"
version = "0.1.0"
edition = "2024"

[dependencies]
cubecoin-core = { path = "../core" }
cubecoin-p2p-proto = { path = "../p2p-proto" }
hex = "0.4.3"
prost = "0.14.4"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9.2"
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
x509-parser = "0.18.0"

[dev-dependencies]
tempfile = "3.27.0"
