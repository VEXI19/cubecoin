[package]
name = "cubecoin-node"
version = "0.1.0"
edition = "2024"

[dependencies]
cubecoin-core = { path = "../core" }
cubecoin-p2p = { path = "../p2p" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
